name: Internal Alpha desktop artifacts

# Unsigned Base3Router Internal Alpha packages. Reuses
# `vp run dist:desktop:artifact` from the existing release pipeline.
# Never signs, notarizes, publishes, or reads repository secrets.

on:
  workflow_dispatch:
    inputs:
      include_macos_x64:
        description: "Build macOS x64 on macos-13 in addition to arm64"
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/internal-alpha-desktop.yml"
      - "scripts/build-desktop-artifact.ts"
      - "scripts/verify-internal-alpha-artifact.ts"
      - "scripts/verify-internal-alpha-artifact.test.ts"
      - "apps/desktop/package.json"

permissions:
  contents: read

concurrency:
  group: internal-alpha-desktop-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate identity and artifact names
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Identity and artifact metadata tests
        run: |
          vp test run \
            apps/web/src/branding.test.ts \
            apps/desktop/src/app/DesktopAppIdentity.test.ts \
            apps/desktop/src/app/DesktopEnvironment.test.ts \
            scripts/build-desktop-artifact.test.ts \
            scripts/verify-internal-alpha-artifact.test.ts

      - name: Confirm unsigned workflow has no signing secrets
        run: |
          if grep -E "secrets\\.(CSC_|APPLE_API_|AZURE_)" .github/workflows/internal-alpha-desktop.yml; then
            echo "Internal Alpha workflow must not reference signing secrets." >&2
            exit 1
          fi

  build-macos-arm64:
    name: Base3Router-Internal-Alpha-mac-arm64
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Public configuration only
        run: cp .env.example .env

      - name: Build unsigned macOS arm64 artifact
        run: |
          vp run dist:desktop:artifact -- \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --output-dir "$RUNNER_TEMP/alpha-artifacts" \
            --verbose

      - name: Verify metadata, checksums, and secret scan
        run: node scripts/verify-internal-alpha-artifact.ts "$RUNNER_TEMP/alpha-artifacts"

      - name: Upload Base3Router-Internal-Alpha-mac-arm64
        uses: actions/upload-artifact@v4
        with:
          name: Base3Router-Internal-Alpha-mac-arm64
          path: |
            ${{ runner.temp }}/alpha-artifacts/Base3Router-Internal-Alpha*
            ${{ runner.temp }}/alpha-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  build-macos-x64:
    name: Base3Router-Internal-Alpha-mac-x64
    if: github.event_name == 'workflow_dispatch' && inputs.include_macos_x64
    needs: validate
    # Same approach as release.yml: Apple Silicon host, electron-builder --arch x64.
    # GitHub-hosted Intel macOS images are not used here.
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Public configuration only
        run: cp .env.example .env

      - name: Build unsigned macOS x64 artifact
        run: |
          vp run dist:desktop:artifact -- \
            --platform mac \
            --target dmg \
            --arch x64 \
            --output-dir "$RUNNER_TEMP/alpha-artifacts" \
            --verbose

      - name: Verify metadata, checksums, and secret scan
        run: node scripts/verify-internal-alpha-artifact.ts "$RUNNER_TEMP/alpha-artifacts"

      - name: Upload Base3Router-Internal-Alpha-mac-x64
        uses: actions/upload-artifact@v4
        with:
          name: Base3Router-Internal-Alpha-mac-x64
          path: |
            ${{ runner.temp }}/alpha-artifacts/Base3Router-Internal-Alpha*
            ${{ runner.temp }}/alpha-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  build-windows-x64:
    name: Base3Router-Internal-Alpha-windows-x64
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        shell: bash
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Public configuration only
        shell: bash
        run: cp .env.example .env

      - name: Build unsigned Windows x64 artifact
        shell: bash
        run: |
          vp run dist:desktop:artifact -- \
            --platform win \
            --target nsis \
            --arch x64 \
            --output-dir "$RUNNER_TEMP/alpha-artifacts" \
            --verbose

      - name: Verify metadata, checksums, and secret scan
        shell: bash
        run: node scripts/verify-internal-alpha-artifact.ts "$RUNNER_TEMP/alpha-artifacts"

      - name: Upload Base3Router-Internal-Alpha-windows-x64
        uses: actions/upload-artifact@v4
        with:
          name: Base3Router-Internal-Alpha-windows-x64
          path: |
            ${{ runner.temp }}/alpha-artifacts/Base3Router-Internal-Alpha*
            ${{ runner.temp }}/alpha-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
