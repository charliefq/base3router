name: Base3Router UI Lab

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ui-lab-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-lab:
    name: Base3Router UI Lab
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/web...
              - --filter=@t3tools/scripts...

      - name: Run Base3Router UI Lab acceptance
        run: node scripts/base3router-ui-lab.ts

      - name: Upload Playwright HTML report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: base3router-ui-lab-report
          path: |
            apps/web/playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: base3router-ui-lab-traces
          path: apps/web/playwright-results
          if-no-files-found: warn
          retention-days: 7
